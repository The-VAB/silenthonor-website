<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="images/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="images/apple-touch-icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>New Password — Silent Honor Foundation</title>
<link rel="stylesheet" href="css/redesign.css">
</head>
<body data-page="login">
<div class="sh">

  <div id="sh-header"></div>

  <section class="auth-wrap">
    <div class="terrain"></div>
    <div class="auth-card">
      <div class="auth-head">
        <span class="eyebrow">Password Reset</span>
        <h1>New Password</h1>
        <p>Choose a new password for your account. Must be at least 8 characters.</p>
      </div>
      <form id="resetForm" class="form" novalidate>
        <div class="field"><label for="new-password">New password</label><input id="new-password" type="password" autocomplete="new-password" required></div>
        <div class="field"><label for="confirm-password">Confirm password</label><input id="confirm-password" type="password" autocomplete="new-password" required></div>
        <button class="btn btn-red btn-block" type="submit">Set New Password <span class="arw">&#8594;</span></button>
        <p class="form-note" id="reset-note" role="status" aria-live="polite"></p>
      </form>
      <div class="auth-alt"><a href="login.html">Back to sign in</a></div>
    </div>
  </section>

  <div id="sh-footer"></div>

</div>
<script src="js/redesign.js"></script>
<script>
  window.API_BASE = "https://e1tyj5meuc.execute-api.us-east-1.amazonaws.com";
  (function () {
    var f = document.getElementById('resetForm'), note = document.getElementById('reset-note');
    var token = new URLSearchParams(location.search).get('token') || '';
    if (!token) { note.textContent = 'This reset link is missing its token. Request a new link from the Forgot Password page.'; note.className = 'form-note err'; }
    f.addEventListener('submit', function (e) {
      e.preventDefault();
      var p1 = document.getElementById('new-password').value || '', p2 = document.getElementById('confirm-password').value || '';
      if (p1.length < 8) { note.textContent = 'Password must be at least 8 characters.'; note.className = 'form-note err'; return; }
      if (p1 !== p2) { note.textContent = 'Passwords do not match.'; note.className = 'form-note err'; return; }
      if (!token) { return; }
      note.textContent = 'Saving…'; note.className = 'form-note';
      fetch(window.API_BASE + '/api/auth/reset-password', {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token: token, new_password: p1 })
      }).then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
        .then(function (x) {
          if (x.ok) { note.textContent = 'Password updated. Redirecting to sign in…'; note.className = 'form-note ok'; setTimeout(function () { location.href = 'login.html'; }, 1400); }
          else { note.textContent = x.d.detail || 'This link is invalid or expired. Request a new one.'; note.className = 'form-note err'; }
        }).catch(function () { note.textContent = 'Network error. Please try again.'; note.className = 'form-note err'; });
    });
  })();
</script>
</body>
</html>
