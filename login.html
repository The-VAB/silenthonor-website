<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="images/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="images/apple-touch-icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Member Login — Silent Honor Foundation</title>
<link rel="stylesheet" href="css/redesign.css">
</head>
<body data-page="login">
<div class="sh">

  <div id="sh-header"></div>

  <section class="auth-wrap">
    <div class="terrain"></div>
    <div class="auth-card">
      <div class="auth-head">
        <span class="eyebrow">Member Login</span>
        <h1>Welcome Back</h1>
        <p>Sign in to reach your dashboard, courses, and coaching.</p>
      </div>
      <form id="loginForm" class="form" novalidate>
        <div class="field"><label for="login-email">Email</label><input id="login-email" type="email" autocomplete="email" required></div>
        <div class="field"><label for="login-password">Password</label><input id="login-password" type="password" autocomplete="current-password" required></div>
        <div class="forgot-link"><a href="forgot-password.html">Forgot password?</a></div>
        <button class="btn btn-red btn-block" type="submit">Sign In <span class="arw">&#8594;</span></button>
        <p class="form-note" id="login-note" role="status" aria-live="polite"></p>
      </form>
      <div class="auth-alt">New here? <a href="signup.html">Become a member — it's free</a></div>
    </div>
  </section>

  <div id="sh-footer"></div>

</div>
<script src="js/redesign.js"></script>
<script>
  window.API_BASE = "https://e1tyj5meuc.execute-api.us-east-1.amazonaws.com";
  (function () {
    var f = document.getElementById('loginForm'), note = document.getElementById('login-note');
    function route(u) {
      var roles = (u && (u.roles || (u.role ? [u.role] : []))) || [];
      if (roles.indexOf('admin') >= 0) location.href = 'admin.html';
      else if (roles.indexOf('counselor') >= 0) location.href = 'counselor-portal.html';
      else if (u && u.verified) location.href = 'dashboard.html';
      else location.href = 'pending.html';
    }
    f.addEventListener('submit', function (e) {
      e.preventDefault();
      var email = (document.getElementById('login-email').value || '').trim();
      var pw = document.getElementById('login-password').value || '';
      if (!email || !pw) { note.textContent = 'Enter your email and password.'; note.className = 'form-note err'; return; }
      note.textContent = 'Signing in…'; note.className = 'form-note';
      fetch(window.API_BASE + '/api/auth/login', {
        method: 'POST', credentials: 'include', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: email, password: pw })
      }).then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
        .then(function (x) { if (x.ok) { route(x.d); } else { note.textContent = x.d.detail || 'Invalid email or password.'; note.className = 'form-note err'; } })
        .catch(function () { note.textContent = 'Network error. Please try again.'; note.className = 'form-note err'; });
    });
  })();
</script>
</body>
</html>
