<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="images/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="images/apple-touch-icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password — Silent Honor Foundation</title>
<link rel="stylesheet" href="css/redesign.css">
</head>
<body data-page="login">
<div class="sh">

  <div id="sh-header"></div>

  <section class="auth-wrap">
    <div class="terrain"></div>
    <div class="auth-card">
      <div class="auth-head">
        <span class="eyebrow">Password Reset</span>
        <h1>Reset Password</h1>
        <p>Enter your email and we'll send you a link to set a new password.</p>
      </div>
      <form id="forgotForm" class="form" novalidate>
        <div class="field"><label for="reset-email">Email</label><input id="reset-email" type="email" autocomplete="email" required></div>
        <button class="btn btn-red btn-block" type="submit">Send Reset Link <span class="arw">&#8594;</span></button>
        <p class="form-note" id="forgot-note" role="status" aria-live="polite"></p>
      </form>
      <div class="auth-alt"><a href="login.html">Back to sign in</a></div>
    </div>
  </section>

  <div id="sh-footer"></div>

</div>
<script src="js/redesign.js"></script>
<script>
  window.API_BASE = "https://e1tyj5meuc.execute-api.us-east-1.amazonaws.com";
  (function () {
    var f = document.getElementById('forgotForm'), note = document.getElementById('forgot-note');
    f.addEventListener('submit', function (e) {
      e.preventDefault();
      var email = (document.getElementById('reset-email').value || '').trim();
      if (!email) { note.textContent = 'Enter your email.'; note.className = 'form-note err'; return; }
      note.textContent = 'Sending…'; note.className = 'form-note';
      fetch(window.API_BASE + '/api/auth/forgot-password', {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email: email })
      }).then(function () {
        note.textContent = 'If an account exists for that email, a reset link is on its way. Check your inbox.'; note.className = 'form-note ok'; f.reset();
      }).catch(function () { note.textContent = 'Network error. Please try again.'; note.className = 'form-note err'; });
    });
  })();
</script>
</body>
</html>
