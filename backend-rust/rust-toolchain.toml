# Bumped off the original 1.82.0 pin: transitive deps (e.g. crypto-common 0.2.2)
# now ship `edition2024` manifests that Cargo < 1.85 cannot even parse, which broke
# a clean resolve. `stable` builds the committed Cargo.lock; dep versions are pinned
# by that lock, so the compiler channel can float forward safely.
[toolchain]
channel = "stable"
components = ["rustfmt", "clippy"]
targets = ["aarch64-unknown-linux-gnu"]
