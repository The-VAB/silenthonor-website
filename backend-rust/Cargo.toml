# Silent Honor Foundation -- Rust / AWS Lambda backend (workspace)
#
# This is the real, from-scratch backend build. It runs as a single Rust binary
# behind API Gateway (HTTP API) on AWS Lambda, talking to the existing
# DocumentDB (MongoDB-compatible) cluster. It is being stood up ALONGSIDE the
# current Python/FastAPI service (strangler migration) -- see docs/RUST_BACKEND.md.
#
# SECURITY: no secrets live in this repo. The JWT signing key and the DocumentDB
# connection string are read at cold start from AWS Secrets Manager via the
# Lambda's IAM role (see crates/sh-core/src/secrets.rs and infra/aws/lambda-api.tf).

[workspace]
resolver = "2"
members = ["crates/sh-core", "crates/api"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
anyhow = "1"
thiserror = "1"
axum = "0.7"
tower = "0.5"
http = "1"
lambda_http = "0.13"
mongodb = "3"
bson = { version = "2", features = ["chrono-0_4"] }
jsonwebtoken = "9"
bcrypt = "0.15"
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-secretsmanager = "1"
time = { version = "0.3", features = ["serde"] }
once_cell = "1"

[profile.release]
# Smaller, faster-cold-start Lambda binaries.
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
